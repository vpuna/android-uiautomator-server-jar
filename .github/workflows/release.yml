name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set Up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # no signing setup needed: the jar is loaded with app_process, not installed
    - name: Build debug APK
      run: ./gradlew assembleDebug

    - name: Rename to u2.jar
      run: |
        rm -fr dist && mkdir -p dist
        mv app/build/outputs/apk/debug/app-debug.apk dist/u2.jar
        sha256sum dist/u2.jar | tee dist/u2.jar.sha256

    # created as a draft so the asset can be tested before the release is published
    - name: Publish release
      run: |
        sha=$(cut -d' ' -f1 dist/u2.jar.sha256)
        printf 'Built from %s by `./gradlew assembleDebug`.\n\nu2.jar SHA-256: `%s`\n' "$GITHUB_SHA" "$sha" > notes.md
        gh release create "$GITHUB_REF_NAME" dist/u2.jar --draft --title "$GITHUB_REF_NAME" --notes-file notes.md
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
